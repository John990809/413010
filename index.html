<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rhythm - A S K L 節奏大師</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background: #0a0c14;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI頂部資訊欄 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 15px;
            z-index: 5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .score-box {
            font-size: 24px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .combo-box {
            font-size: 18px;
            font-weight: 800;
            color: #ff0055;
            text-align: right;
        }

        /* 血條 */
        .hp-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            margin-bottom: 6px;
        }

        .hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ffcc00, #00ff66);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 8px #00ff66;
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* 狂暴能量條 */
        .frenzy-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .frenzy-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #ff0055);
            transition: width 0.1s linear;
        }

        /* 手機端底部按鈕區 */
        .touch-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 5;
            pointer-events: auto;
        }

        .touch-btn {
            width: 22%;
            height: 65px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s, background-color 0.05s;
        }

        .touch-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-lane-0 { border-color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }
        .btn-lane-1 { border-color: #ffcc00; text-shadow: 0 0 8px #ffcc00; }
        .btn-lane-2 { border-color: #ff0055; text-shadow: 0 0 8px #ff0055; }
        .btn-lane-3 { border-color: #00ff66; text-shadow: 0 0 8px #00ff66; }

        /* 遮罩菜單 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 20, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
            overflow-y: auto;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 6px;
            text-shadow: 0 0 15px #00f0ff;
            text-align: center;
        }

        .guide-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 12px;
            width: 100%;
            max-width: 360px;
        }

        /* 25關選擇器網格 */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .level-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .level-card.active {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 8px #00f0ff;
        }

        .level-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #444;
        }

        .level-card .stars {
            font-size: 8px;
            color: #ffcc00;
        }

        .btn {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.2s;
            margin: 4px;
        }

        .btn:active {
            transform: scale(0.95);
            background: #ff0055;
            color: #fff;
        }

        .btn-secondary {
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .btn-endless {
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            background: rgba(255, 215, 0, 0.1);
        }

        .btn-endless:active {
            background: #ffd700;
            color: #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- 頂部資訊區 -->
    <div class="ui-layer">
        <div class="header">
            <div class="score-box" id="score">0</div>
            <div style="text-align: right;">
                <div class="combo-box" id="combo">0 COMBO</div>
                <div id="levelGoal" style="font-size: 11px; color: #ffcc00; font-weight: bold;">目標: 1000</div>
            </div>
        </div>
        <div class="hp-bar-container">
            <div class="hp-bar" id="hpBar"></div>
            <div class="hp-text" id="hpText">HP 100/100</div>
        </div>
        <div class="frenzy-bar-container">
            <div class="frenzy-bar" id="frenzyBar"></div>
        </div>
    </div>

    <!-- 底部觸控按鈕區 -->
    <div class="touch-controls">
        <div class="touch-btn btn-lane-0" id="btn-A" onclick="handleDirectionInput(0)">A</div>
        <div class="touch-btn btn-lane-1" id="btn-S" onclick="handleDirectionInput(1)">S</div>
        <div class="touch-btn btn-lane-2" id="btn-K" onclick="handleDirectionInput(2)">K</div>
        <div class="touch-btn btn-lane-3" id="btn-L" onclick="handleDirectionInput(3)">L</div>
    </div>

    <!-- 開始與選關菜單 -->
    <div class="overlay" id="startMenu">
        <div class="title">NEON RHYTHM</div>
        <div class="guide-box">
            <div id="selectedLevelTitle" style="font-size: 15px; font-weight: bold; color: #00f0ff; margin-bottom: 4px;">關卡 1: 初露鋒芒</div>
            <div id="selectedLevelDesc" style="color: #aaa; margin-bottom: 6px;">目標得分: 1000 分 | 特性: 慢速入門</div>
            <b>操作</b>: A S K L / 鍵盤 ⬅️ ⬇️ ⬆️ ➡️ <br>
            ⭐ <b>黃金音符</b>: +300分 | 💣 <b>炸彈音符</b>: 勿按(-20HP)
        </div>

        <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">選擇關卡 (1 - 25)：</div>
        <div class="level-grid" id="levelGrid"></div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
            <button class="btn" onclick="startGame()">開始關卡</button>
            <button class="btn btn-endless" onclick="startEndlessMode()">∞ 無盡挑戰</button>
        </div>
        <div id="endlessBestText" style="font-size: 12px; color: #ffd700; margin-top: 6px;">最高無盡紀錄: 0 分</div>
    </div>

    <!-- 通關選單 -->
    <div class="overlay" id="levelClearMenu" style="display: none;">
        <div class="title" style="color: #00ff66; text-shadow: 0 0 15px #00ff66;">LEVEL CLEARED!</div>
        <div class="guide-box" style="text-align: center;">
            <div id="clearLevelTitle" style="font-size: 16px; font-weight: bold; color: #ffcc00; margin-bottom: 8px;">關卡 1 達成</div>
            <div id="clearScore" style="font-size: 20px; font-weight: bold; color: #00f0ff;">最終得分: 0</div>
            <div id="clearCombo" style="font-size: 14px; color: #aaa; margin-top: 4px;">最高連擊: 0</div>
        </div>
        <div>
            <button class="btn btn-secondary" onclick="showMenu()">關卡選擇</button>
            <button class="btn" id="nextLevelBtn" onclick="nextLevel()">下一關</button>
        </div>
    </div>

    <!-- 結算選單 -->
    <div class="overlay" id="gameOverMenu" style="display: none;">
        <div class="title" style="color: #ff0055;">GAME OVER</div>
        <div class="guide-box" style="text-align: center;">
            <div id="finalScore" style="font-size: 20px; font-weight: bold; color: #00f0ff;">得分: 0</div>
            <div id="finalCombo" style="font-size: 14px; color: #aaa; margin-top: 5px;">最大連擊: 0</div>
            <div id="newRecordBadge" style="font-size: 13px; color: #ffd700; font-weight: bold; margin-top: 6px; display: none;">🏆 刷新無盡最佳紀錄！</div>
        </div>
        <div>
            <button class="btn btn-secondary" onclick="showMenu()">關卡選擇</button>
            <button class="btn" onclick="retryGame()">再試一次</button>
        </div>
    </div>
</div>

<script>
    const LEVELS = [
        { id: 1, name: "初露鋒芒", speed: 0.8, spawnRate: 900, targetScore: 1000, theme: '#00f0ff', bg: '#050a14', desc: "慢速入門節奏" },
        { id: 2, name: "霓虹夜行", speed: 0.9, spawnRate: 850, targetScore: 1500, theme: '#3399ff', bg: '#08081a', desc: "熟悉四軌步調" },
        { id: 3, name: "電音脈衝", speed: 1.0, spawnRate: 800, targetScore: 2000, theme: '#00ffcc', bg: '#051515', desc: "標準中速節奏" },
        { id: 4, name: "黃金時刻", speed: 1.0, spawnRate: 750, targetScore: 2500, theme: '#ffcc00', bg: '#1a1805', goldChance: 0.25, desc: "出現高分黃金音符(+300分)" },
        { id: 5, name: "極速狂飆", speed: 1.25, spawnRate: 700, targetScore: 3000, theme: '#ff3366', bg: '#1a050d', desc: "音符流速顯著提升" },
        { id: 6, name: "雙重打擊", speed: 1.0, spawnRate: 680, targetScore: 3500, theme: '#cc00ff', bg: '#12051a', doubleChance: 0.2, desc: "偶爾同時出現雙軌音符" },
        { id: 7, name: "地雷警報", speed: 1.1, spawnRate: 650, targetScore: 4000, theme: '#ff4400', bg: '#1a0800', bombChance: 0.18, desc: "小心！避開紅色炸彈音符" },
        { id: 8, name: "賽博浪潮", speed: 1.2, spawnRate: 600, targetScore: 4500, theme: '#00ff99', bg: '#001a10', desc: "密集音符快速落下" },
        { id: 9, name: "紫夜風暴", speed: 1.3, spawnRate: 580, targetScore: 5000, theme: '#9900ff', bg: '#10001a', goldChance: 0.3, desc: "高速高分黃金關" },
        { id: 10, name: "狂暴衝刺", speed: 1.4, spawnRate: 550, targetScore: 6000, theme: '#ff0055', bg: '#20000a', frenzyMult: 1.5, desc: "狂暴能量累積加快" },
        { id: 11, name: "迷幻蒸汽", speed: 1.1, spawnRate: 520, targetScore: 6500, theme: '#ff66cc', bg: '#1a0515', doubleChance: 0.25, desc: "雙音符密集現身" },
        { id: 12, name: "黑客矩陣", speed: 1.4, spawnRate: 500, targetScore: 7000, theme: '#00ff00', bg: '#001500', bombChance: 0.22, desc: "矩陣炸彈地雷陣" },
        { id: 13, name: "超音速巡航", speed: 1.6, spawnRate: 480, targetScore: 7500, theme: '#00ffff', bg: '#001a1a', desc: "考驗瞬間反應的極速關" },
        { id: 14, name: "烈焰狂濤", speed: 1.5, spawnRate: 450, targetScore: 8000, theme: '#ff3300', bg: '#200500', goldChance: 0.35, desc: "滿屏黃金大量產出" },
        { id: 15, name: "混沌交響", speed: 1.35, spawnRate: 430, targetScore: 8500, theme: '#e600ff', bg: '#1a0020', doubleChance: 0.25, bombChance: 0.18, desc: "雙音符與炸彈交織" },
        { id: 16, name: "暗影深淵", speed: 1.7, spawnRate: 420, targetScore: 9000, theme: '#4444ff', bg: '#05051a', desc: "高疾速下落考驗" },
        { id: 17, name: "極光獵手", speed: 1.6, spawnRate: 400, targetScore: 9500, theme: '#00ffaa', bg: '#001a15', goldChance: 0.4, desc: "極光閃耀金幣盛宴" },
        { id: 18, name: "雷霆萬鈞", speed: 1.7, spawnRate: 380, targetScore: 10000, theme: '#ffff00', bg: '#1f1f00', bombChance: 0.25, desc: "高壓地雷佈局" },
        { id: 19, name: "幻影狂潮", speed: 1.75, spawnRate: 360, targetScore: 11000, theme: '#ff00aa', bg: '#1a0010', doubleChance: 0.3, desc: "密集雙重連續擊打" },
        { id: 20, name: "終極對決", speed: 1.85, spawnRate: 340, targetScore: 12000, theme: '#ff2222', bg: '#250000', frenzyMult: 2.0, desc: "極高強度暴速區" },
        { id: 21, name: "星核超新星", speed: 1.9, spawnRate: 320, targetScore: 13000, theme: '#00aaff', bg: '#001020', goldChance: 0.45, desc: "超新星滿屏黃金" },
        { id: 22, name: "虛空風暴", speed: 1.95, spawnRate: 300, targetScore: 14000, theme: '#aa00ff', bg: '#150025', bombChance: 0.3, desc: "虛空炸彈雨陣" },
        { id: 23, name: "光速穿梭", speed: 2.1, spawnRate: 280, targetScore: 15000, theme: '#00ffbb', bg: '#002018', doubleChance: 0.35, desc: "極限光速手速挑戰" },
        { id: 24, name: "滅世狂想曲", speed: 2.2, spawnRate: 260, targetScore: 17000, theme: '#ff0044', bg: '#2b000a', doubleChance: 0.3, bombChance: 0.22, desc: "修羅級全機制混戰" },
        { id: 25, name: "節奏之神", speed: 2.3, spawnRate: 240, targetScore: 20000, theme: '#ffd700', bg: '#2a2000', goldChance: 0.5, doubleChance: 0.35, bombChance: 0.25, desc: "神之領域：終極考驗" }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);
    resize();

    let audioCtx = null;
    const laneFreqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playNote(freq, type = 'sine', duration = 0.2) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    // 遊戲狀態與關卡變數
    const LANES = 4;
    const laneColors = ['#00f0ff', '#ffcc00', '#ff0055', '#00ff66'];
    const laneKeys = ['A', 'S', 'K', 'L'];

    let currentLevelIdx = 0;
    let maxUnlockedLevel = parseInt(localStorage.getItem('nr_max_unlocked') || '1');
    let endlessBestScore = parseInt(localStorage.getItem('nr_endless_best') || '0');

    let gameState = 'MENU';
    let isEndless = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let hp = 100;
    let frenzy = 0;
    let isFrenzyMode = false;

    let targets = [];
    let particles = [];
    let floatingTexts = [];
    let spawnTimeout = null;

    function renderLevelGrid() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';

        LEVELS.forEach((lvl, idx) => {
            const isUnlocked = lvl.id <= maxUnlockedLevel;
            const card = document.createElement('div');
            card.className = `level-card ${idx === currentLevelIdx ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
            card.innerHTML = `
                <div>${lvl.id}</div>
                <div class="stars">${isUnlocked ? '★' : '🔒'}</div>
            `;
            card.onclick = () => {
                if (isUnlocked) {
                    currentLevelIdx = idx;
                    updateSelectedLevelInfo();
                    renderLevelGrid();
                }
            };
            grid.appendChild(card);
        });
    }

    function updateSelectedLevelInfo() {
        const lvl = LEVELS[currentLevelIdx];
        document.getElementById('selectedLevelTitle').innerText = `關卡 ${lvl.id}: ${lvl.name}`;
        document.getElementById('selectedLevelDesc').innerText = `目標得分: ${lvl.targetScore} 分 | ${lvl.desc}`;
        document.getElementById('endlessBestText').innerText = `最高無盡紀錄: ${endlessBestScore} 分`;
    }

    function showMenu() {
        gameState = 'MENU';
        if (spawnTimeout) clearTimeout(spawnTimeout);
        document.getElementById('startMenu').style.display = 'flex';
        document.getElementById('levelClearMenu').style.display = 'none';
        document.getElementById('gameOverMenu').style.display = 'none';
        renderLevelGrid();
        updateSelectedLevelInfo();
    }

    function startGame() {
        initAudio();
        gameState = 'PLAYING';
        isEndless = false;
        score = 0;
        combo = 0;
        maxCombo = 0;
        hp = 100;
        frenzy = 0;
        isFrenzyMode = false;
        targets = [];
        particles = [];
        floatingTexts = [];

        const lvl = LEVELS[currentLevelIdx];
        document.getElementById('levelGoal').innerText = `目標: ${lvl.targetScore}`;
        
        document.getElementById('startMenu').style.display = 'none';
        document.getElementById('gameOverMenu').style.display = 'none';
        document.getElementById('levelClearMenu').style.display = 'none';
        updateUI();

        if (spawnTimeout) clearTimeout(spawnTimeout);
        spawnTarget();
    }

    function startEndlessMode() {
        initAudio();
        gameState = 'PLAYING';
        isEndless = true;
        score = 0;
        combo = 0;
        maxCombo = 0;
        hp = 100;
        frenzy = 0;
        isFrenzyMode = false;
        targets = [];
        particles = [];
        floatingTexts = [];

        document.getElementById('levelGoal').innerText = `無盡挑戰 (最高: ${endlessBestScore})`;
        
        document.getElementById('startMenu').style.display = 'none';
        document.getElementById('gameOverMenu').style.display = 'none';
        document.getElementById('levelClearMenu').style.display = 'none';
        updateUI();

        if (spawnTimeout) clearTimeout(spawnTimeout);
        spawnTarget();
    }

    function retryGame() {
        if (isEndless) {
            startEndlessMode();
        } else {
            startGame();
        }
    }

    function nextLevel() {
        if (currentLevelIdx < LEVELS.length - 1) {
            currentLevelIdx++;
            startGame();
        } else {
            showMenu();
        }
    }

    function spawnTarget() {
        if (gameState !== 'PLAYING') return;

        let speed, spawnRate, bombChance, goldChance, doubleChance;

        if (isEndless) {
            // 無盡模式：根據得分動態加速與調整難度
            const levelProgress = score / 2000;
            speed = 1.0 + Math.min(2.5, levelProgress * 0.25);
            spawnRate = Math.max(180, 800 - levelProgress * 45);
            bombChance = Math.min(0.28, 0.05 + levelProgress * 0.02);
            goldChance = 0.25;
            doubleChance = Math.min(0.35, 0.1 + levelProgress * 0.03);
        } else {
            const lvl = LEVELS[currentLevelIdx];
            speed = lvl.speed;
            spawnRate = lvl.spawnRate;
            bombChance = lvl.bombChance || 0;
            goldChance = lvl.goldChance || 0;
            doubleChance = lvl.doubleChance || 0;
        }

        const lane = Math.floor(Math.random() * LANES);
        
        // 判定音符種類 (普通/黃金/炸彈)
        let noteType = 'normal';
        const rand = Math.random();
        if (bombChance && rand < bombChance) {
            noteType = 'bomb';
        } else if (goldChance && rand < bombChance + goldChance) {
            noteType = 'gold';
        }

        targets.push({
            lane: lane,
            x: (lane + 0.5) * (width / LANES),
            y: -30,
            speed: 4 * speed,
            radius: 22,
            type: noteType,
            hit: false
        });

        // 判定雙音符 spawn
        if (doubleChance && Math.random() < doubleChance) {
            let otherLane = (lane + Math.floor(Math.random() * (LANES - 1)) + 1) % LANES;
            targets.push({
                lane: otherLane,
                x: (otherLane + 0.5) * (width / LANES),
                y: -30,
                speed: 4 * speed,
                radius: 22,
                type: 'normal',
                hit: false
            });
        }

        const spawnInterval = isFrenzyMode ? spawnRate * 0.6 : spawnRate;
        spawnTimeout = setTimeout(spawnTarget, spawnInterval);
    }

    window.addEventListener('keydown', (e) => {
        if (gameState !== 'PLAYING') return;
        const key = e.key.toLowerCase();
        let lane = -1;

        if (key === 'a' || e.key === 'ArrowLeft') lane = 0;
        else if (key === 's' || e.key === 'ArrowDown') lane = 1;
        else if (key === 'k' || e.key === 'ArrowUp') lane = 2;
        else if (key === 'l' || e.key === 'ArrowRight') lane = 3;

        if (lane !== -1) {
            handleDirectionInput(lane);
        }
    });

    function handleDirectionInput(lane) {
        if (gameState !== 'PLAYING') return;

        const judgeY = height - 120;
        let hitAny = false;

        for (let i = 0; i < targets.length; i++) {
            let t = targets[i];
            if (t.lane === lane && !t.hit) {
                let dist = Math.abs(t.y - judgeY);

                if (dist < 65) {
                    processHit(t, i, dist < 25 ? 'PERFECT!' : 'GREAT!');
                    hitAny = true;
                    break;
                }
            }
        }

        // 空按懲罰 (扣 10 HP)
        if (!hitAny) {
            hp = Math.max(0, hp - 10);
            combo = 0;
            const laneCenterX = (lane + 0.5) * (width / LANES);
            addFloatingText(laneCenterX, judgeY, '-10 HP', '#ff3333');
            playNote(120, 'sawtooth', 0.15);
            updateUI();

            if (hp <= 0) {
                triggerGameOver();
            }
        }
    }

    function processHit(target, index, quality) {
        target.hit = true;
        targets.splice(index, 1);

        const lvl = LEVELS[currentLevelIdx];

        // 觸發炸彈懲罰
        if (target.type === 'bomb') {
            hp = Math.max(0, hp - 20);
            combo = 0;
            addFloatingText(target.x, height - 120, '💥 BOMB! -20HP', '#ff0000');
            playNote(90, 'sawtooth', 0.3);
            createParticles(target.x, height - 120, '#ff0000', 20);
            updateUI();
            if (hp <= 0) triggerGameOver();
            return;
        }

        combo++;
        if (combo > maxCombo) maxCombo = combo;
        hp = Math.min(100, hp + (quality === 'PERFECT!' ? 3 : 1));

        let basePts = target.type === 'gold' ? 300 : (quality === 'PERFECT!' ? 100 : 60);
        score += basePts * (isFrenzyMode ? 2 : 1);

        playNote(laneFreqs[target.lane] * (target.type === 'gold' ? 1.5 : 1), 'sine', 0.2);

        if (!isFrenzyMode) {
            const addFrenzy = 8 * (lvl.frenzyMult || 1.0);
            frenzy = Math.min(100, frenzy + addFrenzy);
            if (frenzy >= 100) triggerFrenzy();
        }

        const color = target.type === 'gold' ? '#ffcc00' : laneColors[target.lane];
        createParticles(target.x, height - 120, color, target.type === 'gold' ? 20 : 12);
        addFloatingText(target.x, height - 140, target.type === 'gold' ? '★ GOLD +300' : quality, color);

        if (navigator.vibrate) navigator.vibrate(15);
        updateUI();

        // 檢查一般關卡通關條件 (無盡模式不適用)
        if (!isEndless && score >= lvl.targetScore) {
            triggerLevelClear();
        }
    }

    function processMiss(target, index) {
        targets.splice(index, 1);
        if (target.type !== 'bomb') { // 漏掉炸彈不扣分
            combo = 0;
            hp = Math.max(0, hp - 12);
            addFloatingText(target.x, height - 120, 'MISS', '#888888');
            updateUI();

            if (hp <= 0) {
                triggerGameOver();
            }
        }
    }

    function triggerFrenzy() {
        isFrenzyMode = true;
        addFloatingText(width / 2, height / 2, 'FRENZY MODE!', '#ff0055');
        setTimeout(() => {
            isFrenzyMode = false;
            frenzy = 0;
            updateUI();
        }, 5000);
    }

    function triggerLevelClear() {
        gameState = 'CLEAR';
        if (spawnTimeout) clearTimeout(spawnTimeout);

        const currentLvl = LEVELS[currentLevelIdx];
        // 解鎖下一關
        if (currentLevelIdx + 1 < LEVELS.length && currentLvl.id >= maxUnlockedLevel) {
            maxUnlockedLevel = currentLvl.id + 1;
            localStorage.setItem('nr_max_unlocked', maxUnlockedLevel.toString());
        }

        document.getElementById('clearLevelTitle').innerText = `關卡 ${currentLvl.id}: ${currentLvl.name} 通關！`;
        document.getElementById('clearScore').innerText = `得分: ${score} / 目標: ${currentLvl.targetScore}`;
        document.getElementById('clearCombo').innerText = `最高連擊: ${maxCombo}`;

        const nextBtn = document.getElementById('nextLevelBtn');
        if (currentLevelIdx >= LEVELS.length - 1) {
            nextBtn.style.display = 'none';
        } else {
            nextBtn.style.display = 'inline-block';
        }

        document.getElementById('levelClearMenu').style.display = 'flex';
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        if (spawnTimeout) clearTimeout(spawnTimeout);

        const newRecordBadge = document.getElementById('newRecordBadge');

        if (isEndless) {
            let isNewRecord = false;
            if (score > endlessBestScore) {
                endlessBestScore = score;
                localStorage.setItem('nr_endless_best', endlessBestScore.toString());
                isNewRecord = true;
            }
            document.getElementById('finalScore').innerText = `得分: ${score} (最高: ${endlessBestScore})`;
            newRecordBadge.style.display = isNewRecord ? 'block' : 'none';
        } else {
            document.getElementById('finalScore').innerText = `得分: ${score} / 目標: ${LEVELS[currentLevelIdx].targetScore}`;
            newRecordBadge.style.display = 'none';
        }

        document.getElementById('finalCombo').innerText = `最大連擊: ${maxCombo}`;
        document.getElementById('gameOverMenu').style.display = 'flex';
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                color: color,
                size: Math.random() * 4 + 2,
                life: 1
            });
        }
    }

    function addFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1 });
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = `${combo} COMBO`;
        document.getElementById('hpBar').style.width = `${hp}%`;
        document.getElementById('hpText').innerText = `HP ${hp}/100`;
        document.getElementById('frenzyBar').style.width = `${frenzy}%`;
    }

    function gameLoop() {
        const lvl = LEVELS[currentLevelIdx] || LEVELS[0];
        ctx.fillStyle = isFrenzyMode ? '#15000a' : (lvl.bg || '#0a0c14');
        ctx.fillRect(0, 0, width, height);

        const laneWidth = width / LANES;
        const judgeY = height - 120;

        // 繪製軌道分界線
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let i = 1; i < LANES; i++) {
            ctx.beginPath();
            ctx.moveTo(i * laneWidth, 0);
            ctx.lineTo(i * laneWidth, height);
            ctx.stroke();
        }

        // 繪製判定線 (使用當前關卡主題色)
        ctx.strokeStyle = isFrenzyMode ? '#ff0055' : (lvl.theme || '#00f0ff');
        ctx.lineWidth = 3;
        ctx.shadowBlur = isFrenzyMode ? 15 : 8;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        ctx.moveTo(0, judgeY);
        ctx.lineTo(width, judgeY);
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (gameState === 'PLAYING') {
            // 移動與繪製音符
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                t.y += t.speed;

                ctx.save();
                ctx.translate(t.x, t.y);

                if (t.type === 'bomb') {
                    // 炸彈音符
                    ctx.fillStyle = '#ff0033';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', 0, 1);
                } else if (t.type === 'gold') {
                    // 黃金高分音符
                    ctx.fillStyle = '#ffcc00';
                    ctx.shadowColor = '#ffee00';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', 0, 1);
                } else {
                    // 一般軌道音符
                    ctx.fillStyle = laneColors[t.lane];
                    ctx.shadowColor = laneColors[t.lane];
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(laneKeys[t.lane], 0, 1);
                }
                ctx.restore();

                if (t.y > judgeY + 50) {
                    processMiss(t, i);
                }
            }

            // 繪製爆裂粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            // 繪製動態字樣 (PERFECT, -10 HP, 💥 BOMB)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1;
                ft.life -= 0.025;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                } else {
                    ctx.fillStyle = ft.color;
                    ctx.globalAlpha = ft.life;
                    ctx.font = 'bold 15px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        requestAnimationFrame(gameLoop);
    }

    renderLevelGrid();
    updateSelectedLevelInfo();
    gameLoop();
</script>
